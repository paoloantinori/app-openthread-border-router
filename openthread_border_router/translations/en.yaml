---
configuration:
  device:
    name: Device
    description: The serial port where the OpenThread RCP radio is attached.
  baudrate:
    name: Baudrate
    description: >-
      The serial port baudrate used to communicate with the Silicon Labs radio.
  flow_control:
    name: Hardware flow control
    description: Enable hardware flow control for serial port.
  backbone_interface:
    name: Backbone Network Interface
    description: >-
      The network interface used for the backbone network.
      If not specified, it falls back to the primary interface.
  network_device:
    name: Network Device
    description: >-
      <host:port> when connecting to a device via sockets (takes precedence
      over above configuration). Not recommended! See documentation for more
      information.
  otbr_log_level:
    name: OpenThread Border Router agent log level
    description: >-
      Set logging level of the OpenThread Border Router agent (otbr-agent).
  firewall:
    name: OTBR firewall
    description: >-
      Use OpenThread Border Router firewall to block unnecessary traffic.
  nat64:
    name: NAT64
    description: >-
      Enable IPv6 to IPv4 network address translation. This allows Thread
      devices to communicate with devices on the Internet. Requires border
      routing to be enabled.
  border_routing:
    name: Border routing
    description: >-
      Route traffic between the Thread network and the infrastructure network
      and advertise Thread prefixes with Router Advertisements on the LAN.
      Disable this when another IPv6 router already serves the LAN: the app
      then stops the Backbone Router and its Router Advertisements. The Thread
      network keeps running, but Thread devices cannot reach the Internet,
      their DNS-SD services are not advertised on the LAN, and they lose the
      addresses the Matter Server reaches them at, so they become unavailable
      in Home Assistant within about an hour and recover a few minutes after
      this option is turned back on. Cannot be combined with NAT64.
  beta:
    name: Beta
    description: >-
      Enable beta mode to run a newer, experimental version of OpenThread
      Border Router.
network:
  8080/tcp: OpenThread Web port
  8081/tcp: OpenThread REST API port
